<!--
  Homepage: "What people are saying" testimonials carousel. Squarespace Code block on the homepage.
  Styles: src/blocks/home/testimonials.css. Behavior: src/blocks/home/testimonials.js. Both from jsDelivr at the tag below.
  The small inline style is deliberate: it gives the block its real layout before the stylesheet loads,
  so the Squarespace editor never measures eight stacked, unstyled quotes and grows the block (see docs/jsdelivr-plan.md, step 1 lessons).
  Every rule in it is copied unchanged from testimonials.css, which loads after it and wins.
-->
<style>.bc-quotes{position:relative;box-sizing:border-box;overflow:hidden;padding:56px clamp(24px,6vw,88px) 40px}.bc-quotes__eyebrow{margin:0 0 6px;font:700 13px/1.2 'obviously-wide',Inter,sans-serif}.bc-quotes__title{margin:0 0 28px;max-width:18ch;font:700 clamp(24px,3.4vw,40px)/1.1 'obviously-wide',Inter,sans-serif}.bc-quotes__stage{position:relative;padding-top:8px}.bc-quotes__mark{position:absolute;left:-6px;top:-34px}.bc-quotes__viewport{position:relative}.bc-quotes__slide{position:absolute;left:0;right:0;top:0;margin:0;visibility:hidden}.bc-quotes__slide.is-active{visibility:visible}.bc-quotes__controls{display:flex;align-items:center;gap:18px;margin-top:34px}.bc-quotes__btn{flex:none;width:46px;height:46px;padding:0}@media (max-width:600px){.bc-quotes{padding-top:48px;padding-bottom:48px;margin:36px 0}.bc-quotes__title{max-width:none}.bc-quotes__btn{width:40px;height:40px}}</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bike-coalition/coalition-website@v0.4.0/src/blocks/home/testimonials.css" integrity="sha384-OCbPJ36A3dfh5cw6y8ItKtz4Kkyy5B2ftN53BRSIhEHGQUrzdFdw60I0vacuOPBp" crossorigin="anonymous">

<div class="bc-quotes" id="bcQuotes" role="region" aria-roledescription="carousel" aria-label="What people are saying">
  <p class="bc-quotes__eyebrow">What people are saying</p>
  <h2 class="bc-quotes__title">About the San Diego County Bike Coalition</h2>

  <div class="bc-quotes__stage">
    <span class="bc-quotes__mark" aria-hidden="true">“</span>

    <div class="bc-quotes__viewport" aria-live="polite">
      <figure class="bc-quotes__slide is-active">
        <blockquote>The ride felt very welcoming for kids, which was awesome since you never know how group rides with kids will go. I heard nothing but good things from all the people I knew that participated!</blockquote>
        <figcaption><span class="bc-quotes__name">Khalisa B.</span></figcaption>
      </figure>

      <figure class="bc-quotes__slide">
        <blockquote>Attended Smart Cycling 1 &amp; 2. They are super supportive, meet you where you are. All my questions were answered. You will definitely come out of the course with more knowledge, confidence and feel safer. I highly recommend for all levels. And the ride was very fun!</blockquote>
        <figcaption><span class="bc-quotes__name">Greta S.</span><span class="bc-quotes__tag">Smart Cycling 1 &amp; 2</span></figcaption>
      </figure>

      <figure class="bc-quotes__slide">
        <blockquote>I just want to send a big thank you for all of your work on CicloSDias. It was the best cycling event I have ever attended in San Diego! I met so many great sustainability related organizations that we will be able to work with at the library. I also got to visit with local businesses that I didn’t know about before the event.</blockquote>
        <figcaption><span class="bc-quotes__name">Ocsar G.</span><span class="bc-quotes__tag">CicloSDias</span></figcaption>
      </figure>

      <figure class="bc-quotes__slide">
        <blockquote>The ride was awesome, I felt incredibly safe amidst all of the people working with the coalition to make this bike ride as accessible and beginner friendly as possible. Thank you for all your efforts.</blockquote>
        <figcaption><span class="bc-quotes__name">Dominic D.</span></figcaption>
      </figure>

      <figure class="bc-quotes__slide">
        <blockquote>I wanted to say what a wonderful event the Pride Ride was on Sunday! The ride leaders did a great job and it was neat that they led an activity at Ward Canyon Park. We also loved the cool stickers! That is the longest my 9 year son has ridden and I think the fun atmosphere and encouragement really helped.</blockquote>
        <figcaption><span class="bc-quotes__name">K. Bolling</span><span class="bc-quotes__tag">Pride Ride</span></figcaption>
      </figure>

      <figure class="bc-quotes__slide">
        <blockquote>It was a great event, well organized and well attended. You can tell a lot of planning went into the ride. For my first SD Bike Coalition event, I felt welcomed and part of the gang, with none of the “clickiness” that is often felt being the new guy.</blockquote>
        <figcaption><span class="bc-quotes__name">James T.</span></figcaption>
      </figure>

      <figure class="bc-quotes__slide">
        <blockquote>On behalf of Watkins Wellness, I would like to extend a heartfelt thank you for your generous support and partnership. Your efforts in providing access to bike knowledge, safety resources, and hands-on education have made a meaningful impact on our team.</blockquote>
        <figcaption><span class="bc-quotes__name">G. Rodriguez</span></figcaption>
      </figure>

      <figure class="bc-quotes__slide">
        <blockquote>The road teaches what the classroom can’t 🚴🏾‍♂️ 💡 Movement builds muscles and it builds connection 💪🏾 Grateful for a Sunday that recharged purpose and pedals 🙏🏾 From traffic safety to confidence-building, this was a reminder that wellness is communal.</blockquote>
        <figcaption><span class="bc-quotes__name">Brian W.</span></figcaption>
      </figure>
    </div>
  </div>

  <div class="bc-quotes__controls">
    <button class="bc-quotes__btn" type="button" data-dir="-1" aria-label="Previous quote">←</button>
    <div class="bc-quotes__dots" role="tablist" aria-label="Choose a quote"></div>
    <button class="bc-quotes__btn" type="button" data-dir="1" aria-label="Next quote">→</button>
  </div>
</div>
